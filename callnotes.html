<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call notes</title>
<style>
  :root {
    --paper: #f7f8f6;
    --ink: #1f2a2e;
    --muted: #5c6b70;
    --line: #cfd8d6;
    --field: #ffffff;
    --accent: #0f6e6b;
    --accent-ink: #ffffff;
    --danger: #a8402f;
    --focus: #2b9d97;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--paper); color: var(--ink); }

  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    flex: 1;
  }

  .status {
    color: var(--muted);
    font-size: 13px;
    min-width: 110px;
    text-align: right;
  }

  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .btn-copy { background: var(--accent); color: var(--accent-ink); }
  .btn-copy:hover { background: #0b5a58; }

  .btn-clear { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn-clear:hover { background: #f8ecea; }

  .btn-cancel { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-cancel:hover { background: #eef1f0; }

  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #8d3325; }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 32px;
    align-items: start;
  }

  section h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  .aside section + section { margin-top: 28px; }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 10px 0 4px;
  }

  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(43, 157, 151, 0.2);
  }

  textarea {
    min-height: 110px;
    resize: vertical;
    line-height: 1.5;
  }

  .content section + section { margin-top: 24px; }
  .content section h2 { margin-bottom: 8px; }
  .content textarea { margin-top: 0; }
  .content .tall { min-height: 160px; }

  dialog {
    border: none;
    border-radius: 8px;
    padding: 24px;
    max-width: 380px;
    width: calc(100% - 32px);
    color: var(--ink);
    box-shadow: 0 12px 40px rgba(31, 42, 46, 0.25);
  }
  dialog::backdrop { background: rgba(31, 42, 46, 0.45); }
  dialog h3 { margin: 0 0 8px; font-size: 17px; }
  dialog p { margin: 0 0 20px; color: var(--muted); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; gap: 24px; }
    header { flex-wrap: wrap; padding: 12px 16px; }
    header h1 { flex-basis: 100%; }
    .status { flex: 1; text-align: left; min-width: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Call notes</h1>
  <span class="status" id="status" aria-live="polite"></span>
  <button class="btn-copy" id="btnCopy" type="button">Copy all</button>
  <button class="btn-clear" id="btnClear" type="button">Clear page</button>
</header>

<main>
  <div class="aside">
    <section>
      <h2>Caller</h2>
      <label for="callerName">Caller's name</label>
      <input id="callerName" data-label="Caller's name" type="text" autocomplete="off">
      <label for="callback">Callback Number</label>
      <input id="callback" data-label="Callback Number" type="text" autocomplete="off">
      <label for="email">Email</label>
      <input id="email" data-label="Email" type="text" autocomplete="off">
      <label for="role">Role</label>
      <input id="role" data-label="Role" type="text" autocomplete="off">
    </section>

    <section>
      <h2>Account information</h2>
      <label for="pbxName">PBX name</label>
      <input id="pbxName" data-label="PBX name" type="text" autocomplete="off">
      <label for="phone">Phone number</label>
      <input id="phone" data-label="Phone number" type="text" autocomplete="off">
      <label for="domain">Domain</label>
      <input id="domain" data-label="Domain" type="text" autocomplete="off">
      <label for="adminLink">PBX admin link</label>
      <input id="adminLink" data-label="PBX admin link" type="text" autocomplete="off">
    </section>
  </div>

  <div class="content">
    <section>
      <h2>Issue Reported</h2>
      <textarea id="issue" data-label="Issue Reported"></textarea>
    </section>

    <section>
      <h2>Troubleshooting Steps Performed by Tier 1</h2>
      <textarea id="tier1" data-label="Troubleshooting Steps Performed by Tier 1" class="tall"></textarea>
    </section>

    <section>
      <h2>Troubleshooting Steps Performed by Tier 2</h2>
      <textarea id="tier2" data-label="Troubleshooting Steps Performed by Tier 2" class="tall"></textarea>
    </section>

    <section>
      <h2>Next Steps</h2>
      <textarea id="nextSteps" data-label="Next Steps"></textarea>
    </section>

    <section>
      <h2>Other important information</h2>
      <textarea id="other" data-label="Other important information"></textarea>
    </section>
  </div>
</main>

<dialog id="confirmDialog">
  <h3>Clear all notes?</h3>
  <p>Everything on the page will be deleted. This cannot be undone.</p>
  <div class="dialog-actions">
    <button class="btn-cancel" id="btnCancel" type="button">Keep notes</button>
    <button class="btn-danger" id="btnConfirm" type="button">Clear everything</button>
  </div>
</dialog>

<script>
  const status = document.getElementById('status');
  const dialog = document.getElementById('confirmDialog');
  const fields = () => Array.from(document.querySelectorAll('input[data-label], textarea[data-label]'));

  function showStatus(text) {
    status.textContent = text;
    clearTimeout(showStatus.timer);
    showStatus.timer = setTimeout(() => { status.textContent = ''; }, 2500);
  }

  function buildText() {
    const groups = [
      { title: null, ids: ['callerName', 'callback', 'email', 'role'] },
      { title: 'Account information', ids: ['pbxName', 'phone', 'domain', 'adminLink'] },
    ];
    const lines = [];

    groups.forEach((g, i) => {
      if (i > 0) lines.push('');
      if (g.title) lines.push(g.title);
      g.ids.forEach(id => {
        const el = document.getElementById(id);
        lines.push(`${el.dataset.label}: ${el.value.trim()}`);
      });
    });

    ['issue', 'tier1', 'tier2', 'nextSteps', 'other'].forEach(id => {
      const el = document.getElementById(id);
      lines.push('', `${el.dataset.label}:`, el.value.trim());
    });

    return lines.join('\n');
  }

  async function copyAll() {
    const text = buildText();
    try {
      await navigator.clipboard.writeText(text);
      showStatus('Copied');
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showStatus(ok ? 'Copied' : 'Copy failed');
    }
  }

  function clearAll() {
    fields().forEach(el => { el.value = ''; });
    dialog.close();
    showStatus('Cleared');
    document.getElementById('callerName').focus();
  }

  document.getElementById('btnCopy').addEventListener('click', copyAll);
  document.getElementById('btnClear').addEventListener('click', () => dialog.showModal());
  document.getElementById('btnCancel').addEventListener('click', () => dialog.close());
  document.getElementById('btnConfirm').addEventListener('click', clearAll);

  // Ctrl/Cmd + Shift + C copies everything
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
      e.preventDefault();
      copyAll();
    }
  });
</script>
</body>
</html>
